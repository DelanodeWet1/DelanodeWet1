{% extends 'base.html' %}
{% block title %}BuyThings - Welcome{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card bt-card shadow-sm p-5">
            <h1 class="mb-2">Welcome, {{ request.user.username }}!</h1>
            <p class="text-muted mb-4">You are now logged in.</p>

            <div class="d-flex flex-wrap justify-content-center gap-3 mb-4">
                <a href="{% url 'eCommerce:products_list' %}" class="btn btn-bt-primary btn-lg">Go to Product Catalogue</a>
                <a href="{% url 'eCommerce:store_list' %}" class="btn btn-bt-accent btn-lg">Go to Stores</a>
            </div>

            <form method="POST" action="{% url 'grabsomore:logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-secondary">Logout</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
